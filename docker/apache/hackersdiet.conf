<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

Alias /hackdiet/online /server/bin/httpd/cgi-bin/HDiet/webdoc
<Directory /server/bin/httpd/cgi-bin/HDiet/webdoc>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ScriptAlias /cgi-bin/ /server/bin/httpd/cgi-bin/
    <Directory /server/bin/httpd/cgi-bin>
        Options +ExecCGI
        AddHandler cgi-script .pl
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/hackersdiet-error.log
    CustomLog /var/log/apache2/hackersdiet-access.log combined

    SetEnv PERL5LIB /server/bin/httpd/cgi-bin:/server/bin/httpd/cgi-bin/HDiet/Cgi
</VirtualHost>
