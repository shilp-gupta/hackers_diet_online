<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

Alias /hackdiet/online /var/www/html/hackdiet/online
<Directory /var/www/html/hackdiet/online>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ScriptAlias /cgi-bin/ /server/bin/httpd/cgi-bin/
    <Directory /server/bin/httpd/cgi-bin>
        Options +ExecCGI
        AddHandler cgi-script .pl
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/hackersdiet-error.log
    CustomLog /var/log/apache2/hackersdiet-access.log combined

    SetEnv PERL5LIB /server/bin/httpd/cgi-bin:/server/bin/httpd/cgi-bin/HDiet/Cgi

    # Forward the image's cookie-scope overrides into the CGI environment.
    # Without this, mod_cgid does not pass the server process environment to
    # scripts and the app silently falls back to HTTP_HOST.
    # TMPDIR is forwarded so the vendored CGI.pm spools multipart uploads to
    # /tmp (a tmpfs) deterministically instead of scanning for /var/tmp etc.
    PassEnv HDO_COOKIE_DOMAIN HDO_COOKIE_PATH TMPDIR
</VirtualHost>
